backend:
  name: github
  repo: Sakura-khwansuk/Sakura-khwansuk.github.io
  branch: main
  # GitHub Pages 不提供 OAuth。请先部署 OAuth 代理/认证服务，再启用 CMS 登录。
  # 若使用自建 OAuth 代理，按所选服务的最新文档添加 base_url / auth_endpoint / gateway_url。
  # 不要把 client_secret 或 access token 写入此文件。

site_url: https://Sakura-khwansuk.github.io
display_url: https://Sakura-khwansuk.github.io
media_folder: static/images/uploads
public_folder: /images/uploads

locale: zh_Hans
publish_mode: simple

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    create: true
    slug: "{{slug}}"
    path: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - { label: 简介, name: description, widget: text, required: false }
      - { label: 正文, name: body, widget: markdown }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 分类, name: categories, widget: list, required: false }
      - { label: 封面图片, name: image, widget: image, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: false }

  - name: books
    label: 书单
    label_singular: 书籍
    folder: content/books
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{author}}"
    fields:
      - { label: 书名, name: title, widget: string }
      - { label: 作者, name: author, widget: string }
      - { label: 阅读日期, name: date, widget: date, required: false }
      - { label: 简介, name: description, widget: text, required: false }
      - { label: 封面, name: cover, widget: image, required: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 读后感, name: body, widget: markdown }
      - { label: 草稿, name: draft, widget: boolean, default: false }

  - name: pages
    label: 页面
    files:
      - label: 关于我
        name: about
        file: content/about/index.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 简介, name: description, widget: text, required: false }
          - { label: 正文, name: body, widget: markdown }
